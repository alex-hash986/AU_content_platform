name: ai-content-marketing

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: content_marketing
      POSTGRES_USER: content_marketing
      POSTGRES_PASSWORD: content_marketing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
